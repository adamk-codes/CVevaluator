spring.application.name=cvevaluator
spring.datasource.url=jdbc:postgresql://localhost:5432/cveval
spring.datasource.username=cveval
spring.datasource.password=cveval
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health,info

# Authentication. HS256 over a symmetric secret: this application is both the
# issuer and the verifier of its own tokens, so there is no public key to
# publish and no authorization server to call. Asymmetric RS256 would buy the
# ability to let a third party verify without being able to mint - nobody needs
# that here, and it would mean managing a keypair.
#
# The default is a placeholder, for the same reason the Gemini key below is: a
# fresh clone has to start. It is NOT a secret - it is in git. AuthProperties
# logs a WARN at startup whenever it is in use, so a deployment running on the
# default announces itself in the log rather than looking fine.
#
# Minimum 32 bytes. Nimbus's MACSigner rejects a shorter HS256 key outright, and
# it does so at first-login time rather than at startup.
cvevaluator.auth.jwt.secret=${CVEVAL_JWT_SECRET:dev-only-insecure-signing-key-change-me-in-any-real-deployment}

# How long a token stays valid. There is no refresh token and no revocation
# list: a token is good until it expires, full stop. That is the accepted cost
# of the stateless choice - a logout is a client-side discard, and a compromised
# token cannot be cancelled. Twelve hours covers a working day without a
# re-login mid-demo.
cvevaluator.auth.jwt.ttl=12h

# Browser origins allowed to call this API. The Vite dev server is a different
# origin from the API, so without this every request from the frontend fails
# preflight. Comma-separated; set CVEVAL_CORS_ORIGINS to override.
#
# Explicit origins rather than "*" because "*" is incompatible with sending an
# Authorization header on a credentialed request, and quietly so.
cvevaluator.auth.cors.allowed-origins=${CVEVAL_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

cvevaluator.storage.location=./cv-uploads
# Every extension here needs a signature rule in FileSignatureValidator. Adding
# one without the other fails the context at startup, on purpose - the
# alternative is an extension that silently skips the content check.
cvevaluator.storage.allowed-extensions=pdf,docx,txt

# Upload limits. resolve-lazily stays at its default (false) on purpose: multipart
# is parsed during request dispatch, so an oversized file is rejected before the
# controller method is entered. Nothing large ever reaches application code.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Evaluation. ONLY the api-key is set. Adding spring.ai.google.genai.project-id
# or .location - even to try it - flips the client into Vertex AI mode, and a
# Developer API key is then rejected with a 400 that does not say why.
#
# The fallback is a placeholder rather than an empty string, and that is
# load-bearing. GoogleGenAiChatAutoConfiguration throws at bean-creation time
# when the key is blank - "Incomplete Google GenAI configuration" - which takes
# the whole application context down with it. A fresh clone with no key would
# then fail to start at all rather than merely being unable to evaluate. With a
# placeholder the context builds, and LlmEvaluator refuses the call with a
# readable reason instead. See LlmEvaluator.NOT_CONFIGURED.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Which provider backs ChatModel. Load-bearing since the Anthropic starter
# joined the test classpath for the evaluation harness: every chat
# autoconfiguration on the classpath activates when this is unset, and two
# ChatModel beans make ChatClient.Builder ambiguous, which fails context
# startup with "expected single matching bean but found 2".
#
# Pinning it here means production and every full-context test resolve to
# Gemini no matter what else is on the classpath. The harness overrides it to
# "anthropic" for its own context. Values come from SpringAIModels.
spring.ai.model.chat=google-genai

# How many evaluations one application keeps. Beyond this the oldest are
# deleted when a new one is written. Bounded because a recruiter who edits
# requirements repeatedly would otherwise add two jsonb blobs per application
# per edit, forever, for rows nobody reads. Five covers four consecutive edits,
# which is well past what a job goes through before a decision.
cvevaluator.evaluation.max-per-application=5

# How long a re-evaluation waits for a CV that is still extracting before
# giving up on it. A CV uploaded moments before a requirements edit is still
# PENDING or PROCESSING when the edit fires; without a wait it is skipped, and
# for the last CV submitted the "next requirements change" that would pick it
# up may never come. Set to 0 to skip immediately instead of waiting.
#
# This blocks the PUT that triggered it - see the TODO(D3) in
# AsyncApplicationReevaluationTrigger.
cvevaluator.evaluation.extraction-wait=60s
cvevaluator.evaluation.extraction-poll-interval=500ms

# Text extraction. Below this many non-whitespace characters the CV is marked
# FAILED rather than COMPLETED. A pure "is it blank" check is not enough: a
# scanned PDF usually yields a handful of stray characters, not exactly zero,
# and those would otherwise pass as a successful extraction. Set to 0 to accept
# anything non-blank.
cvevaluator.extraction.minimum-text-length=100

# The pool behind @Async extraction. Bounded on purpose - the Boot default is an
# unbounded queue with an effectively unbounded thread count, which under a burst
# of uploads means every PDF parse gets a thread and the JVM runs out of memory
# before anything pushes back. With these numbers a burst queues instead, and a
# burst larger than the queue is rejected loudly.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=cv-extract-

# No server.tomcat.max-swallow-size here on purpose. The usual advice is to raise
# it so an aborted oversized upload does not close the connection before the 413
# is written. Measured on this stack it changes nothing: at the default 2MB, a
# 60MB upload still gets the full 413 JSON body, with and without
# Expect: 100-continue and with chunked encoding. Tomcat rejects on the declared
# size and responds before the body matters. Adding the property would be cargo
# cult - if a client ever does report a reset instead of a 413, this is the knob.