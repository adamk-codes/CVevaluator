services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cveval-db
    environment:
      POSTGRES_DB: cveval
      POSTGRES_USER: cveval
      POSTGRES_PASSWORD: cveval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  pgdata: